<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel · Top of Talent</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--purple:#c86cff}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
*{cursor:none!important}
body{font-family:Helvetica,'Helvetica Neue',Arial,sans-serif;background:#050506;color:#fff;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
#cur{position:fixed;width:7px;height:7px;background:#c86cff;border-radius:50%;pointer-events:none;z-index:99999;top:0;left:0}
#crng{position:fixed;width:26px;height:26px;border:1px solid rgba(200,108,255,.55);border-radius:50%;pointer-events:none;z-index:99998;top:0;left:0;transition:width .15s,height .15s}
.glow{position:fixed;top:-14%;left:50%;transform:translateX(-50%);width:900px;height:460px;z-index:0;background:radial-gradient(ellipse,rgba(200,108,255,.10),transparent 68%)}
header{position:sticky;top:0;z-index:300;display:flex;align-items:center;gap:12px;padding:18px 30px;background:rgba(5,5,6,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.06)}
header img{width:28px;height:28px}
header .t{font-weight:700;font-size:10px;letter-spacing:.22em;text-transform:uppercase;line-height:1.3}
header .pill{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(200,108,255,.9);border:1px solid rgba(200,108,255,.28);border-radius:20px;padding:5px 12px}
.wrap{flex:1;width:100%;max-width:1080px;margin:0 auto;padding:34px 22px 90px;position:relative;z-index:2}
h1{font-size:clamp(28px,5vw,40px);font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
.sub{font-family:'JetBrains Mono',monospace;font-size:12px;color:rgba(255,255,255,.45);margin-bottom:28px}
.state{text-align:center;padding:90px 20px;font-family:'JetBrains Mono',monospace;color:rgba(255,255,255,.6);font-size:14px;line-height:1.7}
.state h2{font-family:Helvetica,Arial,sans-serif;font-size:26px;color:#fff;margin-bottom:12px}
.state button{margin-top:22px;background:#c86cff;color:#0a0710;border:none;border-radius:11px;padding:14px 28px;font-family:Helvetica,Arial,sans-serif;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.sec-label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.4);margin:30px 0 14px;display:flex;align-items:center;gap:10px}
.sec-label::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card{position:relative;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:22px 22px 18px;overflow:hidden;transition:border-color .2s,transform .2s,background .2s}
.card.clic:hover{border-color:rgba(200,108,255,.4);transform:translateY(-2px);background:rgba(200,108,255,.05)}
.card .k{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:12px}
.card .n{font-size:50px;font-weight:700;line-height:1;letter-spacing:-.02em;color:#fff}
.card .n small{font-size:15px;color:rgba(255,255,255,.35);font-weight:400}
.card .d{font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(255,255,255,.42);margin-top:8px;line-height:1.5}
.card .row{display:flex;align-items:center;gap:10px;margin-top:15px;flex-wrap:wrap}
.card .lnk{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(200,108,255,.92);text-decoration:none;border:1px solid rgba(200,108,255,.3);border-radius:24px;padding:7px 13px;background:transparent;transition:background .15s}
.card .lnk:hover{background:rgba(200,108,255,.1)}
.card .verd{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.card .verd b{color:rgba(200,108,255,.85)}
.spark{font-family:'JetBrains Mono',monospace;font-size:20px;color:rgba(255,255,255,.3)}
.res .card{display:flex;flex-direction:column}
.res .card .d{flex:1}
/* Drawer detalle */
.ovl{position:fixed;inset:0;z-index:500;background:rgba(3,3,5,.72);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .22s}
.ovl.on{opacity:1;pointer-events:auto}
.draw{position:fixed;top:0;right:0;height:100%;width:min(460px,92vw);z-index:501;background:#0b0a0f;border-left:1px solid rgba(200,108,255,.2);transform:translateX(102%);transition:transform .26s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.draw.on{transform:translateX(0)}
.draw .dh{padding:22px 24px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
.draw .dh .kk{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(200,108,255,.85)}
.draw .dh h3{font-size:22px;font-weight:700;margin-top:5px}
.draw .dh .x{position:absolute;top:20px;right:22px;font-size:22px;color:rgba(255,255,255,.5);background:none;border:none;line-height:1}
.draw .db{flex:1;overflow-y:auto;padding:8px 24px 40px}
.grp{margin-top:20px}
.grp .gl{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.grp.ok .gl{color:#7be0a4}.grp.no .gl{color:#e0a4a4}
.grp .gl .c{font-size:10px;color:rgba(255,255,255,.4)}
.item{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.item.ok .dot{background:#7be0a4}.item.no .dot{background:rgba(255,255,255,.22)}
.item .nm{font-size:14px;font-weight:500}
.item .mt{font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,.4);margin-top:2px}
.item .badge{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.12);border-radius:5px;padding:3px 7px}
.item a.mini{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:rgba(200,108,255,.85);text-decoration:none;border:1px solid rgba(200,108,255,.3);border-radius:5px;padding:4px 8px}
.empty{font-family:'JetBrains Mono',monospace;font-size:12px;color:rgba(255,255,255,.35);padding:16px 0}
</style>
</head>
<body>
<div id="cur"></div><div id="crng"></div><div class="glow"></div>
<header>
  <img src="logo.png" alt="TT"><div class="t">Top of<br>Talent</div>
  <div class="pill">Panel Admin</div>
</header>

<div class="wrap">
  <div id="state" class="state"><p>Verificando acceso…</p></div>
  <div id="panel" hidden>
    <h1>Panel de control</h1>
    <div class="sub" id="hola"></div>
    <div class="sec-label">Cifras en vivo · toca una tarjeta para ver el detalle</div>
    <div class="grid" id="stats"></div>
    <div class="sec-label">Recursos · abre y revisa cuando quieras</div>
    <div class="grid res" id="recursos"></div>
  </div>
</div>

<div class="ovl" id="ovl"></div>
<div class="draw" id="draw">
  <div class="dh"><div class="kk" id="dkk"></div><h3 id="dh3"></h3><button class="x" id="dx">&times;</button></div>
  <div class="db" id="ddb"></div>
</div>

<script>
var cur=document.getElementById('cur'),crng=document.getElementById('crng');
var mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;cur.style.left=(mx-3.5)+'px';cur.style.top=(my-3.5)+'px';});
(function loop(){rx+=(mx-rx)*.13;ry+=(my-ry)*.13;crng.style.left=(rx-13)+'px';crng.style.top=(ry-13)+'px';requestAnimationFrame(loop);})();
function showState(h){document.getElementById('panel').hidden=true;var s=document.getElementById('state');s.hidden=false;s.innerHTML=h;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
// Drawer
var ovl=document.getElementById('ovl'),draw=document.getElementById('draw');
function closeDraw(){ovl.classList.remove('on');draw.classList.remove('on');}
document.getElementById('dx').onclick=closeDraw; ovl.onclick=closeDraw;
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDraw();});
function openDraw(kk,title,bodyHtml){document.getElementById('dkk').textContent=kk;document.getElementById('dh3').textContent=title;document.getElementById('ddb').innerHTML=bodyHtml;ovl.classList.add('on');draw.classList.add('on');}
</script>

<script src="legal.js"></script>
<script type="module" src="auth-firebase.js?v=4"></script>

<script type="module">
import { auth, db } from './firebase-config.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { doc, getDoc, getDocs, collection, query, where, getCountFromServer } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

var FIRMA='autorizacion.html?k=tot-firma-2026';
var E1='encuesta?s=mes1-a7f3k9', E2='encuesta?s=final-c2m8p5';

// Roster Top (igual que autorizacion.html) — los "otros" se cargan en vivo.
var TOP=[
 {id:'artista1',name:'Alex Ponce'},{id:'artista2',name:'Johann Vera'},{id:'artista3',name:'Mar Rendón'},
 {id:'artista4',name:'Jombriel'},{id:'artista5',name:'Alex Krack'},{id:'artista6',name:'Dicapo'},
 {id:'artista7',name:'Kenny Die'},{id:'artista8',name:'Yilda'},{id:'artista9',name:'Ren Kai'},{id:'artista10',name:'Blanko'}
];
var OTROS=[]; // {id,name}
var ROSTER=[]; // {id,name,tipo}

onAuthStateChanged(auth, async function(u){
  if(!u){ showState('<h2>Panel de administración</h2><p>Inicia sesión con tu cuenta de administrador para ver el panel.</p><button onclick="window.TotAuth&&TotAuth.openLogin()">Iniciar sesión</button>'); return; }
  var admin=false;
  try{ var s=await getDoc(doc(db,'users',u.uid)); admin=s.exists()&&s.data().isAdmin===true; }catch(e){}
  if(!admin){ showState('<h2>Acceso restringido</h2><p>Esta cuenta ('+esc(u.email||'')+') no es de administrador.</p>'); return; }
  document.getElementById('state').hidden=true;
  document.getElementById('panel').hidden=false;
  document.getElementById('hola').textContent='Sesión de administrador · '+(u.email||'');
  try{ var os=await getDocs(collection(db,'otros_talentos')); os.forEach(function(d){OTROS.push({id:d.id,name:(d.data().name||d.id)});}); }catch(e){}
  ROSTER=TOP.map(function(a){return{id:a.id,name:a.name,tipo:'top'};}).concat(OTROS.map(function(a){return{id:a.id,name:a.name,tipo:'otro'};}));
  cargar();
});

async function count(q){ try{ var s=await getCountFromServer(q); return s.data().count; }catch(e){ console.warn(e); return '—'; } }
function fmt(ts){ try{ var d=ts&&ts.toDate?ts.toDate():(ts?new Date(ts):null); return d?d.toLocaleDateString('es-EC',{day:'2-digit',month:'short',year:'numeric'}):''; }catch(e){ return ''; } }

var stats=[
  {k:'Autorizaciones firmadas',d:'Toca para ver quién firmó y quién falta',lnk:FIRMA,lt:'Abrir firma',det:detAutoriz,
   cnt:function(){return count(collection(db,'autorizaciones'));}},
  {k:'Usuarios registrados',d:'Cuentas creadas en la plataforma',
   cnt:function(){return count(collection(db,'users'));}},
  {k:'Miembros activos',d:'Con membresía (prueba) activa',
   cnt:function(){return count(query(collection(db,'users'),where('isMember','==',true)));}},
  {k:'Flyers de bienvenida',d:'Toca para ver quién ya tiene flyer y quién falta',lnk:'bienvenida-otros.html',lt:'Ver diseño',det:detFlyers,
   cnt:flyersCount},
  {k:'Encuesta 1 · respuestas',d:'Checkpoint del mes 1 · toca para ver quién respondió',lnk:E1,lt:'Ver encuesta',det:function(){return detEncuesta('mes1-a7f3k9','Encuesta 1 · mes 1');},
   cnt:function(){return count(collection(db,'encuestas','mes1-a7f3k9','respuestas'));}},
  {k:'Encuesta 2 · respuestas',d:'Satisfacción · fin · toca para ver quién respondió',lnk:E2,lt:'Ver encuesta',det:function(){return detEncuesta('final-c2m8p5','Encuesta 2 · final');},
   cnt:function(){return count(collection(db,'encuestas','final-c2m8p5','respuestas'));}},
];

function cargar(){
  var el=document.getElementById('stats');
  el.innerHTML=stats.map(function(s,i){
    var clic=s.det?' clic':'';
    var link=s.lnk?'<a class="lnk" href="'+s.lnk+'" target="_blank" data-i="'+i+'">'+s.lt+' &rarr;</a>':'';
    var det=s.det?'<span class="verd" data-det="'+i+'">Ver lista &rarr;</span>':'';
    return '<div class="card'+clic+'" data-i="'+i+'"><div class="k">'+s.k+'</div>'+
      '<div class="n" id="n'+i+'"><span class="spark">···</span></div><div class="d">'+s.d+'</div>'+
      '<div class="row">'+det+link+'</div></div>';
  }).join('');
  stats.forEach(async function(s,i){ var n=await s.cnt(); var e=document.getElementById('n'+i); if(e) e.textContent=n; });
  // Click en tarjeta -> detalle (los links abren aparte)
  el.querySelectorAll('.card.clic').forEach(function(c){
    c.onclick=function(ev){ if(ev.target.closest('a.lnk')) return; var i=+c.getAttribute('data-i'); if(stats[i].det) stats[i].det(); };
  });
  // Recursos
  var recs=[
    {k:'Firma de autorización',d:'Link privado. Por artista: agrega &a=ID',lnk:FIRMA},
    {k:'Encuesta 1 (mes 1)',d:'Checkpoint de la experiencia',lnk:E1},
    {k:'Encuesta 2 (fin)',d:'Satisfacción + precio',lnk:E2},
    {k:'Preview flyer Otros',d:'Vista del diseño de bienvenida',lnk:'bienvenida-otros.html'},
    {k:'Ver artistas',d:'Ranking y perfiles',lnk:'talento'},
    {k:'Otros Talentos',d:'Sección de talentos consolidados',lnk:'p-otros'},
    {k:'Analítica · GA4',d:'Visitas, países, páginas más vistas y tiempo real',lnk:'https://analytics.google.com/analytics/web/',lt:'Abrir GA4'},
  ];
  document.getElementById('recursos').innerHTML=recs.map(function(r){return '<div class="card"><div class="k">'+r.k+'</div><div class="d">'+r.d+'</div><div class="row"><a class="lnk" href="'+r.lnk+'" target="_blank">Abrir &rarr;</a></div></div>';}).join('');
}

// ── Detalle: AUTORIZACIONES ─────────────────────────────
async function detAutoriz(){
  openDraw('Autorizaciones','Firmas de talentos','<div class="empty">Cargando…</div>');
  var firmadas={};
  try{ var snap=await getDocs(collection(db,'autorizaciones'));
    snap.forEach(function(d){ var x=d.data(); firmadas[x.artistaId]={firma:x.firma,nombre:x.nombre,ts:x.creado||x.createdAt||x.ts}; });
  }catch(e){ document.getElementById('ddb').innerHTML='<div class="empty">No se pudo leer.</div>'; return; }
  var ok=[],no=[];
  ROSTER.forEach(function(r){ if(firmadas[r.id]) ok.push({r:r,f:firmadas[r.id]}); else no.push(r); });
  var h='';
  h+='<div class="grp ok"><div class="gl">Firmaron <span class="c">('+ok.length+')</span></div>'+
     (ok.length?ok.map(function(o){return '<div class="item ok"><span class="dot"></span><div><div class="nm">'+esc(o.r.name)+'</div><div class="mt">Firmó: '+esc(o.f.firma||'—')+(fmt(o.f.ts)?' · '+fmt(o.f.ts):'')+'</div></div><span class="badge">'+o.r.tipo+'</span></div>';}).join(''):'<div class="empty">Nadie ha firmado aún.</div>')+'</div>';
  h+='<div class="grp no"><div class="gl">Faltan <span class="c">('+no.length+')</span></div>'+
     no.map(function(r){return '<div class="item no"><span class="dot"></span><div><div class="nm">'+esc(r.name)+'</div></div><a class="mini" href="'+FIRMA+'&a='+encodeURIComponent(r.id)+'" target="_blank">Su link</a></div>';}).join('')+'</div>';
  document.getElementById('ddb').innerHTML=h;
}

// ── Detalle: ENCUESTAS ──────────────────────────────────
async function detEncuesta(id,titulo){
  openDraw('Encuestas',titulo,'<div class="empty">Cargando…</div>');
  var rows=[];
  try{ var snap=await getDocs(collection(db,'encuestas',id,'respuestas'));
    for(var i=0;i<snap.docs.length;i++){ var d=snap.docs[i]; var x=d.data(); var email='';
      try{ var us=await getDoc(doc(db,'users',d.id)); if(us.exists()) email=us.data().email||us.data().nombre||''; }catch(e){}
      rows.push({email:email||d.id,ts:x.creado||x.createdAt||x.ts}); }
  }catch(e){ document.getElementById('ddb').innerHTML='<div class="empty">No se pudo leer.</div>'; return; }
  var h='<div class="grp ok"><div class="gl">Respondieron <span class="c">('+rows.length+')</span></div>'+
    (rows.length?rows.map(function(r){return '<div class="item ok"><span class="dot"></span><div><div class="nm">'+esc(r.email)+'</div>'+(fmt(r.ts)?'<div class="mt">'+fmt(r.ts)+'</div>':'')+'</div></div>';}).join(''):'<div class="empty">Nadie ha respondido aún.</div>')+'</div>';
  document.getElementById('ddb').innerHTML=h;
}

// ── Detalle: FLYERS (registro.json) ─────────────────────
var _reg=null;
async function loadReg(){ if(_reg)return _reg; try{ var r=await fetch('flyers-mail/registro.json',{cache:'no-store'}); _reg=await r.json(); }catch(e){ _reg={otro:{},top:{}}; } return _reg; }
async function flyersCount(){ var r=await loadReg(); var n=Object.keys(r.otro||{}).length+Object.keys(r.top||{}).length; return n+' / '+ROSTER.length; }
async function detFlyers(){
  openDraw('Flyers','Registro de flyers','<div class="empty">Cargando…</div>');
  var reg=await loadReg();
  var have=Object.assign({},reg.otro||{},reg.top||{});
  var ok=[],no=[];
  ROSTER.forEach(function(r){ if(have[r.id]) ok.push({r:r,f:have[r.id]}); else no.push(r); });
  var h='';
  h+='<div class="grp ok"><div class="gl">Con flyer <span class="c">('+ok.length+')</span></div>'+
     (ok.length?ok.map(function(o){return '<div class="item ok"><span class="dot"></span><div><div class="nm">'+esc(o.r.name)+'</div><div class="mt">'+o.r.tipo+'</div></div><a class="mini" href="flyers-mail/'+esc(o.f)+'" target="_blank">Ver</a></div>';}).join(''):'<div class="empty">Aún no hay flyers.</div>')+'</div>';
  h+='<div class="grp no"><div class="gl">Faltan <span class="c">('+no.length+')</span></div>'+
     no.map(function(r){return '<div class="item no"><span class="dot"></span><div><div class="nm">'+esc(r.name)+'</div><div class="mt">'+r.tipo+'</div></div></div>';}).join('')+'</div>';
  document.getElementById('ddb').innerHTML=h;
}
</script>
</body>
</html>
