<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel · Top of Talent</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--purple:#c86cff}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
*{cursor:none!important}
body{font-family:Helvetica,'Helvetica Neue',Arial,sans-serif;background:#050506;color:#fff;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
#cur{position:fixed;width:8px;height:8px;background:#c86cff;border-radius:50%;pointer-events:none;z-index:99999;top:0;left:0}
#crng{position:fixed;width:28px;height:28px;border:1.5px solid rgba(200,108,255,.7);border-radius:50%;pointer-events:none;z-index:99998;top:0;left:0;transition:width .15s,height .15s}
.glow{position:fixed;top:-12%;left:50%;transform:translateX(-50%);width:1000px;height:520px;z-index:0;background:radial-gradient(ellipse,rgba(200,108,255,.14),transparent 66%)}
header{position:sticky;top:0;z-index:300;display:flex;align-items:center;gap:12px;padding:20px 32px;background:rgba(5,5,6,.9);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.06)}
header img{width:30px;height:30px}
header .t{font-weight:700;font-size:10px;letter-spacing:.22em;text-transform:uppercase;line-height:1.3}
header .pill{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#c86cff;border:1px solid rgba(200,108,255,.4);border-radius:20px;padding:5px 12px}
.wrap{flex:1;width:100%;max-width:1080px;margin:0 auto;padding:34px 22px 80px;position:relative;z-index:2}
h1{font-size:clamp(28px,5vw,40px);font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
.sub{font-family:'JetBrains Mono',monospace;font-size:12px;color:rgba(255,255,255,.45);margin-bottom:28px}
.state{text-align:center;padding:90px 20px;font-family:'JetBrains Mono',monospace;color:rgba(255,255,255,.6);font-size:14px;line-height:1.7}
.state h2{font-family:Helvetica,Arial,sans-serif;font-size:26px;color:#fff;margin-bottom:12px}
.state button{margin-top:22px;background:#c86cff;color:#0a0710;border:none;border-radius:11px;padding:14px 28px;font-family:Helvetica,Arial,sans-serif;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;cursor:none!important}
.sec-label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.4);margin:30px 0 14px;display:flex;align-items:center;gap:10px}
.sec-label::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card{position:relative;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:22px 22px 18px;overflow:hidden;transition:border-color .2s,transform .2s}
.card:hover{border-color:rgba(200,108,255,.45);transform:translateY(-2px)}
.card.big{grid-column:span 2}
@media(max-width:520px){.card.big{grid-column:span 1}}
.card .k{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:14px}
.card .n{font-size:52px;font-weight:700;line-height:1;letter-spacing:-.02em;color:#fff}
.card .n .u{font-size:16px;color:rgba(255,255,255,.4);font-weight:400;margin-left:6px}
.card .d{font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(255,255,255,.4);margin-top:8px;line-height:1.5}
.card .lnk{display:inline-flex;align-items:center;gap:6px;margin-top:16px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#c86cff;text-decoration:none;border:1px solid rgba(200,108,255,.4);border-radius:24px;padding:8px 14px;background:rgba(200,108,255,.06)}
.card .lnk:hover{background:rgba(200,108,255,.16)}
.card .glowc{position:absolute;top:-40%;right:-20%;width:180px;height:180px;background:radial-gradient(circle,rgba(200,108,255,.18),transparent 70%);pointer-events:none}
.res .card{display:flex;flex-direction:column}
.res .card .k{margin-bottom:6px}
.res .card .d{flex:1;margin-top:4px}
.spark{font-family:'JetBrains Mono',monospace;font-size:22px;color:rgba(255,255,255,.35)}
</style>
</head>
<body>
<div id="cur"></div><div id="crng"></div><div class="glow"></div>
<header>
  <img src="logo.png" alt="TT"><div class="t">Top of<br>Talent</div>
  <div class="pill">Panel Admin</div>
</header>

<div class="wrap">
  <div id="state" class="state"><p>Verificando acceso…</p></div>
  <div id="panel" style="display:none">
    <h1>Panel de control</h1>
    <div class="sub" id="hola"></div>

    <div class="sec-label">Cifras en vivo</div>
    <div class="grid" id="stats"></div>

    <div class="sec-label">Recursos · abre y revisa cuando quieras</div>
    <div class="grid res" id="recursos"></div>
  </div>
</div>

<script>
var cur=document.getElementById('cur'),crng=document.getElementById('crng');
var mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;cur.style.left=(mx-4)+'px';cur.style.top=(my-4)+'px';});
(function loop(){rx+=(mx-rx)*.13;ry+=(my-ry)*.13;crng.style.left=(rx-14)+'px';crng.style.top=(ry-14)+'px';requestAnimationFrame(loop);})();
function showState(h){document.getElementById('panel').style.display='none';var s=document.getElementById('state');s.style.display='block';s.innerHTML=h;}
</script>

<script src="legal.js"></script>
<script type="module" src="auth-firebase.js?v=4"></script>

<script type="module">
import { auth, db } from './firebase-config.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { doc, getDoc, collection, query, where, getCountFromServer } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

var FIRMA='autorizacion.html?k=tot-firma-2026';
var E1='encuesta?s=mes1-a7f3k9', E2='encuesta?s=final-c2m8p5';

onAuthStateChanged(auth, async function(u){
  if(!u){ showState('<div style="font-size:40px;margin-bottom:14px">·</div><h2>Panel de administración</h2><p>Inicia sesión con tu cuenta de administrador para ver el panel.</p><button onclick="window.TotAuth&&TotAuth.openLogin()">Iniciar sesión</button>'); return; }
  var admin=false;
  try{ var s=await getDoc(doc(db,'users',u.uid)); admin=s.exists()&&s.data().isAdmin===true; }catch(e){}
  if(!admin){ showState('<div style="font-size:40px;margin-bottom:14px">·</div><h2>Acceso restringido</h2><p>Esta cuenta no es de administrador.</p>'); return; }
  document.getElementById('state').style.display='none';
  document.getElementById('panel').style.display='block';
  document.getElementById('hola').textContent='Sesión de administrador · '+(u.email||'');
  cargar();
});

async function count(q){ try{ var s=await getCountFromServer(q); return s.data().count; }catch(e){ console.warn(e); return '—'; } }

async function cargar(){
  var stats=document.getElementById('stats');
  // tarjetas placeholder mientras carga
  var defs=[
    {k:'Autorizaciones firmadas',q:()=>count(collection(db,'autorizaciones')),d:'Talentos que firmaron su consentimiento',lnk:FIRMA,lt:'Abrir firma'},
    {k:'Usuarios registrados',q:()=>count(collection(db,'users')),d:'Cuentas creadas en la plataforma'},
    {k:'Miembros activos',q:()=>count(query(collection(db,'users'),where('isMember','==',true))),d:'Con membresía (prueba) activa'},
    {k:'Encuesta 1 · respuestas',q:()=>count(collection(db,'encuestas','mes1-a7f3k9','respuestas')),d:'Checkpoint del mes 1',lnk:E1,lt:'Ver encuesta'},
    {k:'Encuesta 2 · respuestas',q:()=>count(collection(db,'encuestas','final-c2m8p5','respuestas')),d:'Satisfacción · fin de prueba',lnk:E2,lt:'Ver encuesta'},
  ];
  stats.innerHTML=defs.map(function(_,i){return '<div class="card"><div class="glowc"></div><div class="k">'+_.k+'</div><div class="n" id="n'+i+'"><span class="spark">···</span></div><div class="d">'+_.d+'</div>'+(_.lnk?'<a class="lnk" href="'+_.lnk+'" target="_blank">'+_.lt+' &rarr;</a>':'')+'</div>';}).join('');
  defs.forEach(async function(def,i){ var n=await def.q(); var el=document.getElementById('n'+i); if(el) el.textContent=n; });

  // Recursos (links directos)
  var recs=[
    {k:'Firma de autorización',d:'Link privado para que los talentos firmen. Por artista: agrega &a=ID',lnk:FIRMA,lt:'Abrir'},
    {k:'Encuesta 1 (mes 1)',d:'Checkpoint de la experiencia',lnk:E1,lt:'Abrir'},
    {k:'Encuesta 2 (fin)',d:'Satisfacción + precio',lnk:E2,lt:'Abrir'},
    {k:'Preview flyer Otros',d:'Vista del flyer de bienvenida',lnk:'bienvenida-otros.html',lt:'Abrir'},
    {k:'Ver artistas',d:'Ranking y perfiles',lnk:'talento',lt:'Abrir'},
    {k:'Otros Talentos',d:'Sección de talentos consolidados',lnk:'p-otros',lt:'Abrir'},
  ];
  document.getElementById('recursos').innerHTML=recs.map(function(r){return '<div class="card"><div class="k">'+r.k+'</div><div class="d">'+r.d+'</div><a class="lnk" href="'+r.lnk+'" target="_blank">'+r.lt+' &rarr;</a></div>';}).join('');
}
</script>
</body>
</html>
