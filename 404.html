<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada · Top of Talent</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0a0710;color:#ece9f3;font-family:Helvetica,'Helvetica Neue',Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
  background-image:radial-gradient(ellipse 80% 55% at 50% 42%,rgba(200,108,255,.16),transparent 62%)}
.box{max-width:600px}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:#c86cff;margin-bottom:14px}
.code{font-size:clamp(88px,22vw,150px);font-weight:800;line-height:.9;letter-spacing:-.04em;color:#c86cff;text-shadow:0 0 60px rgba(200,108,255,.45)}
h1{font-size:clamp(22px,4.6vw,32px);font-weight:800;letter-spacing:.02em;text-transform:uppercase;margin:16px 0 22px}
.q{font-size:clamp(17px,3vw,20px);font-weight:700;color:#fff;margin-bottom:10px}
p{font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.85;color:rgba(255,255,255,.6);margin-bottom:28px}
.btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
a.glass{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:#fff;text-decoration:none;padding:15px 26px;border-radius:12px;
  background:rgba(200,108,255,.12);border:1px solid rgba(200,108,255,.4);
  -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 0 20px rgba(200,108,255,.28);transition:all .2s}
a.glass:hover{background:rgba(200,108,255,.22);border-color:#c86cff;box-shadow:inset 0 1px 0 rgba(255,255,255,.32), 0 0 30px 5px rgba(200,108,255,.55)}
.brand{margin-top:48px;display:flex;justify-content:center}
.brand img{height:44px;width:auto;opacity:.9}
</style></head>
<body>
<div class="box">
  <div class="eyebrow">Error 404</div>
  <div class="code">404</div>
  <h1>Aquí no hay talento</h1>
  <div class="q">¿Cómo llegaste aquí?</div>
  <p>En esta página no encontramos talento. Pero ya que llegaste, estás a un click de conocer más artistas:</p>
  <div class="btns">
    <a class="glass" href="/talento">Top Artistas</a>
    <a class="glass" href="/proyectos">Proyectos</a>
  </div>
  <div class="brand"><img src="logo-lockup-white.png" alt="Top of Talent"></div>
</div>
</body></html>
